[workspace]
resolver = "3"
members = [
    "apps/cli",
    "apps/desktop/src-tauri",
    "crates/downpour-core",
    "crates/downpour-grabber",
    "crates/downpour-ipc",
    "crates/downpour-media",
    "crates/downpour-nm-host",
    "crates/downpour-store",
    "crates/downpour-testkit",
    "crates/downpour-types",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Downpour contributors"]
description = "Cross-platform, multi-connection download manager"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "net",
    "sync",
    "time",
    "process",
    "signal",
    "test-util",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "rustls-native-certs",
    "stream",
    "cookies",
    "socks",
    "http2",
] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
uuid = { version = "1.18", features = ["v7", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
bytes = "1.10"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
axum = "0.8"
interprocess = { version = "2.4", features = ["tokio"] }
m3u8-rs = "6.0"
scraper = "0.29"
url = "2.5"
texting_robots = "0.2"
fs4 = { version = "1.1", features = ["tokio"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
proptest = "1.6"
tempfile = "3.14"
tower-http = { version = "0.6", features = ["cors", "trace"] }
http-body-util = "0.1"
getrandom = "0.3"
