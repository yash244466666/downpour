[package]
name = "downpour-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Downpour desktop application"

[lib]
name = "downpour_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
downpour-core = { path = "../../../crates/downpour-core" }
downpour-ipc = { path = "../../../crates/downpour-ipc" }
downpour-store = { path = "../../../crates/downpour-store" }
downpour-types = { path = "../../../crates/downpour-types" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio.workspace = true
tracing.workspace = true
url.workspace = true
